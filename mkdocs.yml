site_name: DC20 — Regole
site_description: Regole di gioco di DC20 (Beta 0.10.5) in italiano, con i termini di gioco in inglese.

theme:
  name: material
  language: it
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - header.autohide
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Passa al tema scuro
      primary: orange
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Passa al tema chiaro
      primary: orange
      accent: lime

plugins:
  - search:
      lang:
        - it
        - en

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

